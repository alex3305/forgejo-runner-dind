---
name: Docker Build, Push and Release

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths-ignore:
      - .forgejo/**
      - .vscode/**
      - .editorconfig
      - .gitignore
      - .yamllint
      - LICENSE
      - README.md
      - renovate.json
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push Images"
        default: true
        required: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: ⤵️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: docker-bake.hcl

      - name: Get Forgejo Runner version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -i "^FORGEJO_RUNNER_VERSION" docker-bake.hcl |
                    cut -d " " -f3 |
                    tr -d '"')

          echo "Resolved Forgejo Runner version - $VERSION"
          echo "semver=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 🚀 Create release
        # yamllint disable-line rule:line-length
        uses: akkuman/gitea-release-action@5a83c90484ef4355121df5eb60558c8ce66e81ac # v1
        if: ${{ github.event_name == 'push' || inputs.push_images == true }}
        with:
          name: "v${{ steps.version.outputs.semver }}"
          tag_name: "v${{ steps.version.outputs.semver }}"

  build-and-push:
    name: Docker Build and Push Container to registries
    runs-on: ubuntu-latest
    needs: [release]
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: ⤵️ Checkout created tag
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🏗️ Setup qemu
        # yamllint disable-line rule:line-length
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: 🏗️ Set up Docker Buildx
        # yamllint disable-line rule:line-length
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: 🔑 Docker Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔑 Docker Login to GHCR Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 🔑 Docker Login to Local Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: 1d.lol
          username: ${{ vars.LOCAL_PACKAGES_USERNAME }}
          password: ${{ secrets.LOCAL_PACKAGES_TOKEN }}

      - name: 👷 Docker Build and push latest
        # yamllint disable-line rule:line-length
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          push: ${{ github.event_name == 'push' || inputs.push_images == true }}
          source: "."
          targets: release
